<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tideway-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="tideway-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tideway-grad-accent" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bg-grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />

  <!-- Background Wave -->
  <path d="M 24 74 C 38 52, 56 50, 72 60 C 86 70, 96 66, 102 52" stroke="url(#tideway-grad-1)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Main Sweeping Tide Wave -->
  <path d="M 18 52 C 34 26, 56 30, 72 44 C 86 56, 96 52, 104 36" stroke="url(#tideway-grad-2)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Accent Lower Tide Wave -->
  <path d="M 22 84 C 40 60, 62 62, 78 74 C 90 82, 98 78, 104 66" stroke="url(#tideway-grad-accent)" stroke-width="7.5" stroke-linecap="round" fill="none" />

  <!-- Organization Nodes / Sorting particles -->
  <circle cx="86" cy="36" r="4.5" fill="#38bdf8" />
  <circle cx="98" cy="62" r="3.5" fill="#a5f3fc" />
  <circle cx="30" cy="76" r="3" fill="#818cf8" />
</svg>

