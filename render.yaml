services:
  - type: web
    name: tideway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_CORS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:8000"
      - key: AUTO_OPEN_BROWSER
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_LOG_FILES
        value: "50"

